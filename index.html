<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Пати в Ливадии</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    /* клубничная матча */
    --straw:#f6a8bd;
    --straw-deep:#e26d86;
    --straw-rich:#d4536f;
    --matcha:#bfd6a4;
    --matcha-deep:#88ac68;
    --matcha-rich:#6b9050;
    --cream:#fdf4ea;
    --cream-2:#f8ead9;
    --text:#5b4a4d;
    --glass:rgba(255,255,255,.5);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Manrope',sans-serif;
    color:var(--text);
    overflow-x:hidden;
    background:linear-gradient(125deg,var(--cream) 0%,var(--straw) 42%,var(--matcha) 100%);
    background-size:300% 300%;
    animation:bgShift 24s ease infinite;
    min-height:100vh;
  }
  @keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  .bokeh{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .bokeh span{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(246,168,189,.25));
    filter:blur(2px);animation:floatUp linear infinite;bottom:-160px;opacity:.5;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0) scale(.6);opacity:0}
    10%{opacity:.55}90%{opacity:.45}
    100%{transform:translateY(-118vh) translateX(40px) scale(1.1);opacity:0}
  }

  /* ===== LOADER ===== */
  #loader{
    position:fixed;inset:0;z-index:1000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:42px;
    background:radial-gradient(circle at 50% 40%,var(--cream),var(--straw) 72%,var(--matcha));
    transition:opacity .9s ease,visibility .9s ease;
  }
  #loader.hide{opacity:0;visibility:hidden}
  .rose{width:200px;height:200px;position:relative;filter:drop-shadow(0 18px 22px rgba(226,109,134,.35))}
  .rose svg{width:100%;height:100%;overflow:visible}
  .petal{transform-origin:100px 120px;opacity:0;animation:bloom 2.6s ease forwards}
  .petal.p1{animation-delay:.2s}.petal.p2{animation-delay:.5s}.petal.p3{animation-delay:.8s}
  .petal.p4{animation-delay:1.1s}.petal.p5{animation-delay:1.4s}.petal.p6{animation-delay:1.7s}
  .core{transform-origin:100px 110px;transform:scale(0);animation:pop 1s ease .1s forwards}
  @keyframes bloom{0%{opacity:0;transform:scale(.2) rotate(var(--r))}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(var(--r))}}
  @keyframes pop{to{transform:scale(1)}}
  .loadtxt{font-family:'Fredoka',sans-serif;font-weight:500;font-size:1.3rem;color:var(--straw-rich);letter-spacing:2px}

  .vine{position:relative;width:min(70vw,460px);height:46px}
  .vine .stem{
    position:absolute;top:50%;left:0;height:6px;width:0;transform:translateY(-50%);border-radius:6px;
    background:linear-gradient(90deg,var(--matcha-rich),var(--matcha));
    animation:grow 4.4s ease forwards;box-shadow:0 2px 8px rgba(107,144,80,.4);
  }
  @keyframes grow{to{width:100%}}
  .vine .leaf{position:absolute;top:50%;width:22px;height:14px;opacity:0;background:var(--matcha-deep);border-radius:0 80% 0 80%;animation:leafPop .5s ease forwards}
  .vine .leaf.l1{left:18%;transform:translateY(-130%) rotate(-25deg);animation-delay:1s}
  .vine .leaf.l2{left:38%;transform:translateY(30%) rotate(150deg);animation-delay:1.9s}
  .vine .leaf.l3{left:58%;transform:translateY(-130%) rotate(-25deg);animation-delay:2.7s}
  .vine .leaf.l4{left:80%;transform:translateY(30%) rotate(150deg);animation-delay:3.5s}
  @keyframes leafPop{from{opacity:0;scale:0}to{opacity:1;scale:1}}

  /* ===== SCREENS ===== */
  .screen{position:relative;z-index:2;min-height:100vh;display:none;flex-direction:column;align-items:center;padding:6vh 5vw 9vh}
  .screen.active{display:flex;animation:screenIn .8s ease}
  @keyframes screenIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}

  /* title – bubble / foil, non-cursive */
  .title{
    font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:clamp(2.6rem,8vw,6rem);line-height:1.05;text-align:center;letter-spacing:1px;
    background:linear-gradient(135deg,#fff,var(--straw) 22%,var(--straw-deep) 48%,var(--matcha) 76%,#fff);
    background-size:200% 200%;-webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    text-shadow:0 1px 0 #fff,0 4px 6px rgba(226,109,134,.3),0 10px 24px rgba(136,172,104,.35);
    filter:drop-shadow(0 6px 10px rgba(246,168,189,.45));
    animation:foil 6s ease infinite,floaty 5s ease-in-out infinite;
  }
  @keyframes foil{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  .subtitle{margin-top:16px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(1.3rem,3.4vw,2.1rem);color:var(--straw-rich);animation:floaty 5s ease-in-out infinite .4s}
  .pick-hint{margin-top:8px;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;opacity:.55}

  .grid{margin-top:48px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px;width:min(1000px,92vw)}
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:18px}}
  @media(max-width:460px){.grid{grid-template-columns:1fr}}

  .card{perspective:1200px;aspect-ratio:3/4;cursor:pointer;opacity:0;transform:translateY(40px);animation:cardIn .7s ease forwards}
  .card:nth-child(1){animation-delay:.1s}.card:nth-child(2){animation-delay:.2s}.card:nth-child(3){animation-delay:.3s}
  .card:nth-child(4){animation-delay:.4s}.card:nth-child(5){animation-delay:.5s}.card:nth-child(6){animation-delay:.6s}
  @keyframes cardIn{to{opacity:1;transform:none}}
  .inner{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.25,1);transform-style:preserve-3d;border-radius:26px}
  .card:hover .inner,.card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;overflow:hidden;box-shadow:0 16px 34px rgba(226,109,134,.26);border:3px solid rgba(255,255,255,.7)}
  .front{display:flex;align-items:flex-end;justify-content:center;color:#fff}
  .front .photo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4.4rem}
  .front .name-band{position:relative;z-index:2;width:100%;padding:16px;text-align:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.4rem;background:linear-gradient(to top,rgba(0,0,0,.32),transparent);text-shadow:0 2px 6px rgba(0,0,0,.3)}
  .back{transform:rotateY(180deg);background:linear-gradient(145deg,var(--cream),var(--straw));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center}
  .back h3{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.6rem;color:var(--straw-rich)}
  .back .quote{font-size:1rem;line-height:1.5;font-weight:500}
  .btn{border:none;border-radius:40px;cursor:pointer;font-family:'Manrope',sans-serif;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--straw-deep),var(--straw));box-shadow:0 8px 18px rgba(226,109,134,.4);transition:transform .2s ease,box-shadow .2s ease}
  .btn:hover{transform:translateY(-3px) scale(1.04)}
  .btn.matcha{background:linear-gradient(135deg,var(--matcha-rich),var(--matcha-deep));box-shadow:0 8px 18px rgba(107,144,80,.4)}
  .btn.ghost{background:var(--glass);color:var(--text);box-shadow:0 6px 16px rgba(0,0,0,.08);backdrop-filter:blur(8px)}
  .back .choose{margin-top:4px;padding:10px 22px;font-size:.85rem}
  .card.chosen .face{border-color:var(--matcha-deep);box-shadow:0 0 0 4px var(--matcha),0 18px 36px rgba(136,172,104,.5)}

  .cta-row{margin-top:46px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;opacity:0;transform:translateY(14px);transition:.5s}
  .cta-row.show{opacity:1;transform:none}
  .cta-row .btn{padding:16px 34px;font-size:1.05rem}

  /* ===== QUIZ ===== */
  .quiz-wrap{width:min(820px,94vw);background:var(--glass);backdrop-filter:blur(16px);border:2px solid rgba(255,255,255,.6);border-radius:30px;box-shadow:0 24px 60px rgba(226,109,134,.22);padding:34px 30px;margin-top:10px}
  .q-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.85rem;letter-spacing:1px;text-transform:uppercase;color:var(--straw-rich)}
  .q-round-name{color:var(--matcha-rich)}
  .progress{height:8px;border-radius:8px;background:rgba(255,255,255,.55);margin:16px 0 26px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--straw-deep),var(--matcha-deep));transition:width .5s ease}
  .q-text{font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(1.4rem,4vw,2.1rem);line-height:1.3;text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center}
  .q-img{max-width:100%;max-height:240px;border-radius:18px;margin:8px auto 0;display:block;box-shadow:0 10px 24px rgba(0,0,0,.15)}
  .timer{margin:22px auto 6px;width:120px;height:120px;position:relative}
  .timer svg{transform:rotate(-90deg)}
  .timer .bg{stroke:rgba(255,255,255,.5)}
  .timer .fg{stroke:var(--straw-deep);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .4s}
  .timer .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:2rem}
  .answer{margin-top:18px;text-align:center;font-weight:700;font-size:1.3rem;color:var(--matcha-rich);background:rgba(255,255,255,.55);border-radius:18px;padding:16px;display:none}
  .answer.show{display:block;animation:screenIn .5s ease}
  .answer span{display:block;font-size:.75rem;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin-bottom:6px;color:var(--text)}
  .q-controls{margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .q-controls .btn{padding:13px 26px;font-size:.95rem}

  /* round intro */
  .round-intro{text-align:center;padding:30px 10px}
  .round-intro .big{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(2rem,6vw,3.4rem);color:var(--straw-rich)}
  .round-intro .desc{margin-top:14px;font-size:1.05rem;max-width:520px;margin-inline:auto;line-height:1.5}
  .round-intro .meta{margin-top:18px;font-weight:700;color:var(--matcha-rich)}

  /* scoreboard */
  .scorebar{width:min(820px,94vw);margin-top:18px;background:var(--glass);backdrop-filter:blur(12px);border:2px solid rgba(255,255,255,.55);border-radius:24px;padding:16px 18px}
  .scorebar h4{font-family:'Fredoka',sans-serif;font-weight:600;text-align:center;color:var(--straw-rich);margin-bottom:12px}
  .teams{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .team{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.6);border-radius:40px;padding:6px 8px 6px 14px}
  .team input{border:none;background:transparent;font-family:'Manrope';font-weight:700;font-size:.9rem;width:84px;color:var(--text)}
  .team input:focus{outline:none}
  .team .sc{font-family:'Fredoka';font-weight:600;min-width:26px;text-align:center;color:var(--matcha-rich)}
  .team button{width:28px;height:28px;border:none;border-radius:50%;cursor:pointer;font-weight:800;color:#fff;font-size:1rem;line-height:1}
  .team .plus{background:var(--matcha-deep)}.team .minus{background:var(--straw-deep)}

  .top-back{position:fixed;top:18px;left:18px;z-index:60;padding:10px 18px;font-size:.85rem;border-radius:40px}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="rose">
    <svg viewBox="0 0 200 200">
      <ellipse class="petal p1" style="--r:0deg"   cx="100" cy="70" rx="34" ry="52" fill="#f6a8bd"/>
      <ellipse class="petal p2" style="--r:60deg"  cx="100" cy="70" rx="34" ry="52" fill="#f193ad"/>
      <ellipse class="petal p3" style="--r:120deg" cx="100" cy="70" rx="34" ry="52" fill="#f7b3c5"/>
      <ellipse class="petal p4" style="--r:180deg" cx="100" cy="70" rx="34" ry="52" fill="#ec7e9b"/>
      <ellipse class="petal p5" style="--r:240deg" cx="100" cy="70" rx="34" ry="52" fill="#f9bfce"/>
      <ellipse class="petal p6" style="--r:300deg" cx="100" cy="70" rx="34" ry="52" fill="#f29db5"/>
      <circle class="core" cx="100" cy="110" r="26" fill="#e26d86"/>
      <circle class="core" cx="100" cy="110" r="13" fill="#ef93aa"/>
    </svg>
  </div>
  <div class="loadtxt">расцветаем…</div>
  <div class="vine">
    <div class="stem"></div>
    <div class="leaf l1"></div><div class="leaf l2"></div>
    <div class="leaf l3"></div><div class="leaf l4"></div>
  </div>
</div>

<div class="bokeh" id="bokeh"></div>

<!-- ===== SCREEN 1: HERO ===== -->
<section class="screen" id="hero">
  <h1 class="title">Пати в&nbsp;Ливадии</h1>
  <div class="subtitle">Выбери своего бойца</div>
  <div class="pick-hint">наведи курсор · нажми · выбери</div>
  <div class="grid" id="grid"></div>
  <div class="cta-row" id="ctaRow">
    <button class="btn matcha" id="startQuizBtn">Поехали в квиз →</button>
  </div>
</section>

<!-- ===== SCREEN 2: QUIZ ===== -->
<section class="screen" id="quiz">
  <button class="btn ghost top-back" id="backHome">← На главную</button>
  <div id="quizStage"></div>
  <div class="scorebar" id="scorebar" style="display:none">
    <h4>Счёт команд</h4>
    <div class="teams" id="teams"></div>
  </div>
</section>

<script>
/* ============================================================
   ДАННЫЕ КВИЗА  —  заполняйте вопросы здесь.
   Каждый раунд: {title, desc, timer(сек), questions:[{q, a, img}]}
   img — необязательно (ссылка на картинку для фото/муз. раунда)
============================================================ */
const QUIZ = [
  {
    title:"Раунд 1 · Разминка",
    desc:"Лёгкие вопросы, чтобы войти в ритм. Отвечаем хором, без напряга.",
    timer:30,
    questions:[
      {q:"ПРИМЕР: В каком море находится Ливадия?", a:"Чёрное море"},
      {q:"ПРИМЕР: Сколько игроков на корте в парном падел-матче?", a:"Четверо (2 на 2)"},
      {q:"⟶ ваш вопрос…", a:"⟶ ваш ответ…"},
      {q:"⟶ ваш вопрос…", a:"⟶ ваш ответ…"},
      {q:"⟶ ваш вопрос…", a:"⟶ ваш ответ…"},
      {q:"⟶ ваш вопрос…", a:"⟶ ваш ответ…"},
      {q:"⟶ ваш вопрос…", a:"⟶ ваш ответ…"},
    ]
  },
  {
    title:"Раунд 2 · Это про нас",
    desc:"Вопросы про нашу компанию: кто что любит, смешные истории, привычки.",
    timer:30,
    questions:[
      {q:"ПРИМЕР: Кто из девчонок всегда опаздывает на корт?", a:"⟶ впишите имя"},
      {q:"⟶ ваш вопрос про нас…", a:"⟶ ответ…"},
      {q:"⟶ ваш вопрос про нас…", a:"⟶ ответ…"},
      {q:"⟶ ваш вопрос про нас…", a:"⟶ ответ…"},
      {q:"⟶ ваш вопрос про нас…", a:"⟶ ответ…"},
      {q:"⟶ ваш вопрос про нас…", a:"⟶ ответ…"},
      {q:"⟶ ваш вопрос про нас…", a:"⟶ ответ…"},
    ]
  },
  {
    title:"Раунд 3 · Музыкальный",
    desc:"Включаем отрывок песни — угадываем исполнителя или название.",
    timer:25,
    questions:[
      {q:"ПРИМЕР: Чей это хит? (включите отрывок)", a:"⟶ исполнитель / трек"},
      {q:"⟶ песня…", a:"⟶ ответ…"},
      {q:"⟶ песня…", a:"⟶ ответ…"},
      {q:"⟶ песня…", a:"⟶ ответ…"},
      {q:"⟶ песня…", a:"⟶ ответ…"},
      {q:"⟶ песня…", a:"⟶ ответ…"},
      {q:"⟶ песня…", a:"⟶ ответ…"},
    ]
  },
  {
    title:"Раунд 4 · Угадай по фото",
    desc:"Картинка на экране — угадываем, что/кто это. Добавьте ссылку img.",
    timer:25,
    questions:[
      {q:"ПРИМЕР: Что за место на фото?", a:"⟶ ответ…", img:""},
      {q:"⟶ что на фото…", a:"⟶ ответ…", img:""},
      {q:"⟶ что на фото…", a:"⟶ ответ…", img:""},
      {q:"⟶ что на фото…", a:"⟶ ответ…", img:""},
      {q:"⟶ что на фото…", a:"⟶ ответ…", img:""},
      {q:"⟶ что на фото…", a:"⟶ ответ…", img:""},
      {q:"⟶ что на фото…", a:"⟶ ответ…", img:""},
    ]
  },
  {
    title:"Раунд 5 · Блиц",
    desc:"Быстрые вопросы, короткий таймер. Кто быстрее — тот и молодец!",
    timer:15,
    questions:[
      {q:"ПРИМЕР: Столица Италии?", a:"Рим"},
      {q:"⟶ блиц…", a:"⟶ ответ…"},
      {q:"⟶ блиц…", a:"⟶ ответ…"},
      {q:"⟶ блиц…", a:"⟶ ответ…"},
      {q:"⟶ блиц…", a:"⟶ ответ…"},
      {q:"⟶ блиц…", a:"⟶ ответ…"},

      {q:"⟶ блиц…", a:"⟶ ответ…"},
      {q:"⟶ блиц…", a:"⟶ ответ…"},

  },
  {
    title:"Раунд 6 · Кто из нас",
    desc:"Угадываем, о ком из девчонок идёт речь. Самый «наш» раунд.",
    timer:30,
    questions:[
      {q:"ПРИМЕР: Кто из нас может проговорить весь матч и ни разу не устать?", a:"⟶ имя"},
      {q:"⟶ кто из нас…", a:"⟶ имя"},
      {q:"⟶ кто из нас…", a:"⟶ имя"},

    ]
  },
  {
    title:"Раунд 7 · Финал со ставками",
    desc:"Перед вопросом команда ставит баллы (от 1 до 5). Угадала — получает ставку, нет — теряет.",
    timer:45,
    questions:[
      {q:"ПРИМЕР: Сколько весит теннисный мяч (в граммах)?", a:"≈ 57–58 г"},
      {q:"⟶ финальный вопрос…", a:"⟶ ответ…"},
      {q:"⟶ финальный вопрос…", a:"⟶ ответ…"},
      {q:"⟶ финальный вопрос…", a:"⟶ ответ…"},
      {q:"⟶ супер-финал…", a:"⟶ ответ…"},
    ]
  },
];

/* ---------- fighters ---------- */
const fighters = [
  {name:"Гелик",    emoji:"🍓", bg:"linear-gradient(160deg,#f6a8bd,#fdf4ea)", quote:"«Бью по мячу — попадаю в сердце»"},
  {name:"Викусик",  emoji:"🌸", bg:"linear-gradient(160deg,#f7b3c5,#f8ead9)", quote:"«Грация снаружи, ракета внутри»"},
  {name:"Настюшка", emoji:"🍵", bg:"linear-gradient(160deg,#bfd6a4,#e7f0d8)", quote:"«Тише едешь — дальше бьёшь»"},
  {name:"Соник",    emoji:"⚡", bg:"linear-gradient(160deg,#cfe6b6,#fde0e9)", quote:"«Быстрее мяча, громче победы»"},
  {name:"Евик",     emoji:"🦋", bg:"linear-gradient(160deg,#f6a8bd,#bfd6a4)", quote:"«Лёгкая подача, тяжёлый нокаут»"},
  {name:"Алина",    emoji:"✨", bg:"linear-gradient(160deg,#f8ead9,#f7b3c5)", quote:"«Спокойствие — моё секретное оружие»"},
];

/* ---------- build cards ---------- */
const grid=document.getElementById('grid');
fighters.forEach(f=>{
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`
    <div class="inner">
      <div class="face front" style="background:${f.bg}">
        <div class="photo">${f.emoji}</div>
        <div class="name-band">${f.name}</div>
      </div>
      <div class="face back">
        <h3>${f.name}</h3>
        <div class="quote">${f.quote}</div>
        <button class="btn choose">Играю за неё</button>
      </div>
    </div>`;
  card.addEventListener('click',e=>{if(e.target.classList.contains('choose'))return;card.classList.toggle('flipped')});
  card.querySelector('.choose').addEventListener('click',e=>{
    e.stopPropagation();
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('chosen'));
    card.classList.add('chosen');
    document.getElementById('ctaRow').classList.add('show');
  });
  grid.appendChild(card);
});

/* ---------- bokeh ---------- */
const bk=document.getElementById('bokeh');
for(let i=0;i<18;i++){
  const s=document.createElement('span');
  const size=20+Math.random()*70;
  s.style.width=s.style.height=size+'px';
  s.style.left=Math.random()*100+'vw';
  s.style.animationDuration=(12+Math.random()*16)+'s';
  s.style.animationDelay=(-Math.random()*20)+'s';
  bk.appendChild(s);
}

/* ---------- screen switching ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}

/* ---------- scoreboard ---------- */
const teamsEl=document.getElementById('teams');
function buildTeams(){
  teamsEl.innerHTML='';
  ['Команда 1','Команда 2'].forEach(nm=>{
    const t=document.createElement('div');t.className='team';
    t.innerHTML=`<input value="${nm}"/><button class="minus">−</button><span class="sc">0</span><button class="plus">+</button>`;
    const sc=t.querySelector('.sc');
    t.querySelector('.plus').onclick=()=>sc.textContent=(+sc.textContent+1);
    t.querySelector('.minus').onclick=()=>sc.textContent=Math.max(0,+sc.textContent-1);
    teamsEl.appendChild(t);
  });
}
buildTeams();

/* ---------- QUIZ ENGINE ---------- */
const stage=document.getElementById('quizStage');
let rIdx=0,qIdx=0,timerInt=null;
const CIRC=2*Math.PI*52;

function renderRoundIntro(){
  clearInterval(timerInt);
  document.getElementById('scorebar').style.display='block';
  const r=QUIZ[rIdx];
  stage.innerHTML=`
    <div class="quiz-wrap">
      <div class="round-intro">
        <div class="big">${r.title}</div>
        <div class="desc">${r.desc}</div>
        <div class="meta">${r.questions.length} вопрос(ов) · ${r.timer} сек на каждый</div>
        <div class="q-controls">
          <button class="btn matcha" id="goRound">Начать раунд →</button>
        </div>
        <div style="margin-top:10px;font-size:.8rem;opacity:.6">Раунд ${rIdx+1} из ${QUIZ.length}</div>
      </div>
    </div>`;
  document.getElementById('goRound').onclick=()=>{qIdx=0;renderQuestion()};
}

function renderQuestion(){
  clearInterval(timerInt);
  const r=QUIZ[rIdx],q=r.questions[qIdx];
  const prog=Math.round(((qIdx)/r.questions.length)*100);
  stage.innerHTML=`
    <div class="quiz-wrap">
      <div class="q-top"><span class="q-round-name">${r.title}</span><span>Вопрос ${qIdx+1} / ${r.questions.length}</span></div>
      <div class="progress"><i style="width:${prog}%"></i></div>
      <div class="q-text">${q.q}</div>
      ${q.img?`<img class="q-img" src="${q.img}" alt=""/>`:''}
      <div class="timer">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle class="bg" cx="60" cy="60" r="52" fill="none" stroke-width="10"/>
          <circle class="fg" id="ring" cx="60" cy="60" r="52" fill="none" stroke-width="10"
            stroke-dasharray="${CIRC}" stroke-dashoffset="0"/>
        </svg>
        <div class="num" id="tnum">${r.timer}</div>
      </div>
      <div class="answer" id="answer"><span>Правильный ответ</span>${q.a}</div>
      <div class="q-controls">
        <button class="btn ghost" id="prevBtn">←</button>
        <button class="btn" id="revealBtn">Показать ответ</button>
        <button class="btn matcha" id="nextBtn">${qIdx+1<r.questions.length?'Следующий →':(rIdx+1<QUIZ.length?'Следующий раунд →':'Финиш 🏆')}</button>
      </div>
    </div>`;
  startTimer(r.timer);
  document.getElementById('revealBtn').onclick=()=>{document.getElementById('answer').classList.add('show');clearInterval(timerInt)};
  document.getElementById('prevBtn').onclick=()=>{if(qIdx>0){qIdx--;renderQuestion()}else if(rIdx>0){rIdx--;qIdx=QUIZ[rIdx].questions.length-1;renderQuestion()}};
  document.getElementById('nextBtn').onclick=()=>{
    if(qIdx+1<r.questions.length){qIdx++;renderQuestion()}
    else if(rIdx+1<QUIZ.length){rIdx++;renderRoundIntro()}
    else renderFinish();
  };
}

function startTimer(sec){
  const ring=document.getElementById('ring'),num=document.getElementById('tnum');
  let t=sec;num.textContent=t;
  timerInt=setInterval(()=>{
    t--;num.textContent=Math.max(0,t);
    ring.style.strokeDashoffset=CIRC*(1-t/sec);
    if(t<=Math.ceil(sec*0.3))ring.style.stroke='var(--straw-rich)';
    if(t<=0){clearInterval(timerInt);num.textContent='⏰'}
  },1000);
}

function renderFinish(){
  clearInterval(timerInt);
  stage.innerHTML=`
    <div class="quiz-wrap">
      <div class="round-intro">
        <div class="big">Квиз окончен! 🏆</div>
        <div class="desc">Сверяем счёт на табло внизу и поздравляем победителей. Шампанское — обязательная часть протокола 🥂</div>
        <div class="q-controls">
          <button class="btn matcha" id="restart">Сыграть заново</button>
          <button class="btn ghost" id="home2">На главную</button>
        </div>
      </div>
    </div>`;
  document.getElementById('restart').onclick=()=>{rIdx=0;qIdx=0;renderRoundIntro()};
  document.getElementById('home2').onclick=()=>show('hero');
}

/* ---------- nav ---------- */
document.getElementById('startQuizBtn').onclick=()=>{show('quiz');rIdx=0;qIdx=0;renderRoundIntro()};
document.getElementById('backHome').onclick=()=>{clearInterval(timerInt);show('hero')};

/* ---------- loader → hero ---------- */
window.addEventListener('load',()=>{
  setTimeout(()=>{
    document.getElementById('loader').classList.add('hide');
    show('hero');
  },4800);
});
</script>
</body>
</html>
