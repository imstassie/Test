<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Пати в Ливадии</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Comfortaa:wght@400;600;700&family=Marck+Script&display=swap" rel="stylesheet" />
<style>
  :root{
    --pink:#ffd9e6;
    --pink-deep:#ff9ec4;
    --rose:#ff6fa5;
    --milk:#fff6ef;
    --milk-2:#fdeede;
    --pistachio:#cfe8c5;
    --pistachio-deep:#a9d3a0;
    --text:#6b4a57;
    --glass:rgba(255,255,255,.45);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Comfortaa',sans-serif;
    color:var(--text);
    overflow-x:hidden;
    background:linear-gradient(120deg,var(--milk) 0%,var(--pink) 45%,var(--pistachio) 100%);
    background-size:300% 300%;
    animation:bgShift 22s ease infinite;
    min-height:100vh;
  }
  @keyframes bgShift{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  /* floating bokeh background */
  .bokeh{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .bokeh span{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(255,158,196,.25));
    filter:blur(2px);
    animation:floatUp linear infinite;
    bottom:-160px;
    opacity:.55;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0) scale(.6);opacity:0}
    10%{opacity:.6}
    90%{opacity:.5}
    100%{transform:translateY(-118vh) translateX(40px) scale(1.1);opacity:0}
  }

  /* ===== LOADER ===== */
  #loader{
    position:fixed;inset:0;z-index:1000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:42px;
    background:radial-gradient(circle at 50% 40%,var(--milk),var(--pink) 70%,var(--pistachio));
    transition:opacity .9s ease,visibility .9s ease;
  }
  #loader.hide{opacity:0;visibility:hidden}

  .rose{width:200px;height:200px;position:relative;filter:drop-shadow(0 18px 22px rgba(255,111,165,.35))}
  .rose svg{width:100%;height:100%;overflow:visible}
  .petal{transform-origin:100px 120px;opacity:0;animation:bloom 2.6s ease forwards}
  .petal.p1{animation-delay:.2s}
  .petal.p2{animation-delay:.5s}
  .petal.p3{animation-delay:.8s}
  .petal.p4{animation-delay:1.1s}
  .petal.p5{animation-delay:1.4s}
  .petal.p6{animation-delay:1.7s}
  .core{transform-origin:100px 110px;transform:scale(0);animation:pop 1s ease .1s forwards}
  @keyframes bloom{
    0%{opacity:0;transform:scale(.2) rotate(var(--r))}
    60%{opacity:1}
    100%{opacity:1;transform:scale(1) rotate(var(--r))}
  }
  @keyframes pop{to{transform:scale(1)}}

  .loadtxt{font-family:'Marck Script',cursive;font-size:1.5rem;color:var(--rose);letter-spacing:1px}

  /* vine loading bar */
  .vine{position:relative;width:min(70vw,460px);height:46px}
  .vine .stem{
    position:absolute;top:50%;left:0;height:6px;width:0;
    transform:translateY(-50%);border-radius:6px;
    background:linear-gradient(90deg,var(--pistachio-deep),var(--pistachio));
    animation:grow 4.4s ease forwards;
    box-shadow:0 2px 8px rgba(120,170,110,.4);
  }
  @keyframes grow{to{width:100%}}
  .vine .leaf{
    position:absolute;top:50%;width:22px;height:14px;opacity:0;
    background:var(--pistachio-deep);border-radius:0 80% 0 80%;
    animation:leafPop .5s ease forwards;
  }
  .vine .leaf.l1{left:18%;transform:translateY(-130%) rotate(-25deg);animation-delay:1s}
  .vine .leaf.l2{left:38%;transform:translateY(30%) rotate(150deg);animation-delay:1.9s}
  .vine .leaf.l3{left:58%;transform:translateY(-130%) rotate(-25deg);animation-delay:2.7s}
  .vine .leaf.l4{left:78%;transform:translateY(30%) rotate(150deg);animation-delay:3.5s}
  @keyframes leafPop{from{opacity:0;scale:0}to{opacity:1;scale:1}}
  .vine .bud{
    position:absolute;top:50%;right:-6px;transform:translateY(-50%) scale(0);
    font-size:1.6rem;animation:budShow .6s ease 4s forwards;
  }
  @keyframes budShow{to{transform:translateY(-50%) scale(1)}}

  /* ===== MAIN ===== */
  main{
    position:relative;z-index:2;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:7vh 5vw 9vh;
    opacity:0;transform:translateY(30px);
    transition:opacity 1s ease .2s,transform 1s ease .2s;
  }
  main.show{opacity:1;transform:none}

  /* bubble / foil title */
  .title{
    font-family:'Pacifico',cursive;
    font-size:clamp(2.6rem,8vw,6rem);
    line-height:1.05;text-align:center;
    background:linear-gradient(135deg,#fff,#ffd9e6 25%,#ff9ec4 50%,#cfe8c5 78%,#fff);
    background-size:200% 200%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    text-shadow:
      0 1px 0 #fff,
      0 4px 6px rgba(255,111,165,.35),
      0 10px 24px rgba(169,211,160,.4);
    filter:drop-shadow(0 6px 10px rgba(255,158,196,.45));
    animation:foil 6s ease infinite,floaty 5s ease-in-out infinite;
    letter-spacing:1px;
  }
  @keyframes foil{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  .subtitle{
    margin-top:18px;
    font-family:'Marck Script',cursive;
    font-size:clamp(1.4rem,3.6vw,2.4rem);
    color:var(--rose);
    text-shadow:0 2px 8px rgba(255,255,255,.7);
    animation:floaty 5s ease-in-out infinite .4s;
  }

  .pick-hint{margin-top:8px;font-size:.85rem;letter-spacing:2px;text-transform:uppercase;opacity:.55}

  /* cards grid */
  .grid{
    margin-top:54px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:32px;
    width:min(1000px,92vw);
  }
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:20px}}
  @media(max-width:460px){.grid{grid-template-columns:1fr}}

  .card{
    perspective:1200px;
    aspect-ratio:3/4;
    cursor:pointer;
    opacity:0;transform:translateY(40px);
    animation:cardIn .7s ease forwards;
  }
  .card:nth-child(1){animation-delay:.1s}
  .card:nth-child(2){animation-delay:.2s}
  .card:nth-child(3){animation-delay:.3s}
  .card:nth-child(4){animation-delay:.4s}
  .card:nth-child(5){animation-delay:.5s}
  .card:nth-child(6){animation-delay:.6s}
  @keyframes cardIn{to{opacity:1;transform:none}}

  .inner{
    position:relative;width:100%;height:100%;
    transition:transform .8s cubic-bezier(.2,.8,.25,1);
    transform-style:preserve-3d;
    border-radius:26px;
  }
  .card:hover .inner,.card.flipped .inner{transform:rotateY(180deg)}

  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:26px;overflow:hidden;
    box-shadow:0 16px 34px rgba(255,111,165,.28);
    border:3px solid rgba(255,255,255,.7);
  }
  .front{
    display:flex;align-items:flex-end;justify-content:center;
    color:#fff;
  }
  .front .photo{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:4.4rem;
  }
  .front .name-band{
    position:relative;z-index:2;width:100%;
    padding:16px;text-align:center;
    font-family:'Pacifico',cursive;font-size:1.5rem;
    background:linear-gradient(to top,rgba(0,0,0,.35),transparent);
    text-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .back{
    transform:rotateY(180deg);
    background:linear-gradient(145deg,var(--milk),var(--pink));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:22px;text-align:center;
  }
  .back h3{font-family:'Pacifico',cursive;font-size:1.7rem;color:var(--rose)}
  .back .quote{font-family:'Marck Script',cursive;font-size:1.2rem;line-height:1.45}
  .back .choose{
    margin-top:6px;padding:10px 22px;border:none;border-radius:40px;cursor:pointer;
    font-family:'Comfortaa',sans-serif;font-weight:700;font-size:.85rem;color:#fff;
    background:linear-gradient(135deg,var(--rose),var(--pink-deep));
    box-shadow:0 8px 18px rgba(255,111,165,.45);
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .back .choose:hover{transform:translateY(-3px) scale(1.05)}
  .card.chosen .face{border-color:var(--pistachio-deep);box-shadow:0 0 0 4px var(--pistachio),0 18px 36px rgba(169,211,160,.5)}

  /* selected banner */
  .selected{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);
    z-index:50;
    background:var(--glass);backdrop-filter:blur(14px);
    border:2px solid rgba(255,255,255,.7);
    padding:14px 28px;border-radius:50px;
    font-weight:700;color:var(--text);
    box-shadow:0 14px 30px rgba(255,111,165,.3);
    transition:transform .5s cubic-bezier(.2,.9,.3,1.2);
    display:flex;align-items:center;gap:10px;
  }
  .selected.show{transform:translateX(-50%) translateY(0)}
  .selected b{color:var(--rose)}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="rose">
    <svg viewBox="0 0 200 200">
      <g>
        <ellipse class="petal p1" style="--r:0deg"   cx="100" cy="70"  rx="34" ry="52" fill="#ff9ec4"/>
        <ellipse class="petal p2" style="--r:60deg"  cx="100" cy="70"  rx="34" ry="52" fill="#ff8bb8"/>
        <ellipse class="petal p3" style="--r:120deg" cx="100" cy="70"  rx="34" ry="52" fill="#ffa9cd"/>
        <ellipse class="petal p4" style="--r:180deg" cx="100" cy="70"  rx="34" ry="52" fill="#ff7eae"/>
        <ellipse class="petal p5" style="--r:240deg" cx="100" cy="70"  rx="34" ry="52" fill="#ffb6d5"/>
        <ellipse class="petal p6" style="--r:300deg" cx="100" cy="70"  rx="34" ry="52" fill="#ff96c2"/>
        <circle  class="core" cx="100" cy="110" r="26" fill="#ff5f9c"/>
        <circle  class="core" cx="100" cy="110" r="13" fill="#ff85b6"/>
      </g>
    </svg>
  </div>
  <div class="loadtxt">расцветаем…</div>
  <div class="vine">
    <div class="stem"></div>
    <div class="leaf l1"></div>
    <div class="leaf l2"></div>
    <div class="leaf l3"></div>
    <div class="leaf l4"></div>
    <div class="bud">🌹</div>
  </div>
</div>

<!-- BACKGROUND -->
<div class="bokeh" id="bokeh"></div>

<!-- MAIN -->
<main id="main">
  <h1 class="title">Пати в&nbsp;Ливадии</h1>
  <div class="subtitle">Выбери своего бойца</div>
  <div class="pick-hint">наведи курсор · нажми · выбери</div>

  <div class="grid" id="grid"></div>
</main>

<div class="selected" id="selected">Сегодня ты играешь за <b id="who"></b> 🎾</div>

<script>
  /* ---- fighters ---- */
  const fighters = [
    {name:"Гелик",    emoji:"💖", bg:"linear-gradient(160deg,#ff9ec4,#ffd9e6)", quote:"«Бью по мячу — попадаю в сердце»"},
    {name:"Викусик",  emoji:"🌸", bg:"linear-gradient(160deg,#ffb6d5,#fff6ef)", quote:"«Грация снаружи, ракета внутри»"},
    {name:"Настюшка", emoji:"🍃", bg:"linear-gradient(160deg,#a9d3a0,#cfe8c5)", quote:"«Тише едешь — дальше бьёшь»"},
    {name:"Соник",    emoji:"⚡", bg:"linear-gradient(160deg,#cfe8c5,#ffd9e6)", quote:"«Быстрее мяча, громче победы»"},
    {name:"Евик",     emoji:"🦋", bg:"linear-gradient(160deg,#ff9ec4,#cfe8c5)", quote:"«Лёгкая подача, тяжёлый нокаут»"},
    {name:"Твоё имя", emoji:"✨", bg:"linear-gradient(160deg,#fdeede,#ffb6d5)", quote:"«Шестая боец — скажи имя!»"},
  ];

  const grid = document.getElementById('grid');
  fighters.forEach(f=>{
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `
      <div class="inner">
        <div class="face front" style="background:${f.bg}">
          <div class="photo">${f.emoji}</div>
          <div class="name-band">${f.name}</div>
        </div>
        <div class="face back">
          <h3>${f.name}</h3>
          <div class="quote">${f.quote}</div>
          <button class="choose">Играю за неё</button>
        </div>
      </div>`;
    // tap to flip on touch / click
    card.addEventListener('click',e=>{
      if(e.target.classList.contains('choose')) return;
      card.classList.toggle('flipped');
    });
    card.querySelector('.choose').addEventListener('click',e=>{
      e.stopPropagation();
      document.querySelectorAll('.card').forEach(c=>c.classList.remove('chosen'));
      card.classList.add('chosen');
      document.getElementById('who').textContent = f.name;
      const sel = document.getElementById('selected');
      sel.classList.add('show');
    });
    grid.appendChild(card);
  });

  /* ---- bokeh ---- */
  const bk = document.getElementById('bokeh');
  for(let i=0;i<18;i++){
    const s=document.createElement('span');
    const size=20+Math.random()*70;
    s.style.width=s.style.height=size+'px';
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(12+Math.random()*16)+'s';
    s.style.animationDelay=(-Math.random()*20)+'s';
    bk.appendChild(s);
  }

  /* ---- reveal main after loader ---- */
  window.addEventListener('load',()=>{
    setTimeout(()=>{
      document.getElementById('loader').classList.add('hide');
      document.getElementById('main').classList.add('show');
    },4800);
  });
</script>
</body>
</html>
