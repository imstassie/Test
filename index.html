<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Квиз плиз. Ливадия edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    /* bloom / retro floral palette */
    --sage:#a3b67e;--sage-deep:#8ca268;--sage-dark:#6e844c;
    --cream:#f3eedb;--cream-2:#eae3cc;
    --pink:#e3a9c4;--pink-deep:#d18cad;--pink-dark:#b87a99;
    --text:#586a3c;--glass:rgba(243,238,219,.5);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Quicksand',sans-serif;color:var(--text);overflow-x:hidden;
    background:linear-gradient(125deg,#aaba84 0%,#97aa72 55%,#b0c08e 100%);
    background-size:280% 280%;animation:bgShift 26s ease infinite;min-height:100vh;
  }
  @keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  /* chunky 3D bubble text */
  .bubble{
    font-family:'Fredoka',sans-serif;font-weight:700;color:var(--cream);
    text-shadow:0 1px 0 var(--pink),0 2px 0 var(--pink),0 3px 0 var(--pink-deep),
      0 4px 0 var(--pink-deep),0 5px 0 var(--pink-dark),0 6px 0 var(--pink-dark),
      0 8px 12px rgba(70,60,30,.35);
    letter-spacing:1px;
  }

  /* floating retro flowers */
  .garden{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .garden .fl{position:absolute;bottom:-160px;opacity:.45;animation:drift linear infinite}
  .garden .fl svg{width:100%;height:100%;display:block}
  @keyframes drift{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.5}88%{opacity:.4}100%{transform:translateY(-122vh) rotate(160deg);opacity:0}}

  /* ============ LOADER ============ */
  #loader{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    background:radial-gradient(circle at 50% 38%,#cdd9a8,var(--sage) 65%,var(--sage-deep));
    transition:opacity 1s ease,visibility 1s ease}
  #loader.hide{opacity:0;visibility:hidden}
  .emblem{position:relative;width:210px;height:210px;display:flex;align-items:center;justify-content:center}
  .halo{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,var(--cream),var(--pink),var(--sage-dark),var(--pink),var(--cream));
    -webkit-mask:radial-gradient(farthest-side,transparent 64%,#000 66%);mask:radial-gradient(farthest-side,transparent 64%,#000 66%);
    animation:spin 4s linear infinite;filter:drop-shadow(0 8px 18px rgba(110,132,76,.4))}
  @keyframes spin{to{transform:rotate(360deg)}}
  .glow{position:absolute;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(243,238,219,.9),transparent 70%);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(.85);opacity:.7}50%{transform:scale(1.12);opacity:1}}
  .lflower{position:relative;z-index:2;width:110px;height:110px;animation:spinSlow 9s linear infinite}
  .lflower svg{width:100%;height:100%;filter:drop-shadow(0 5px 9px rgba(110,132,76,.4))}
  @keyframes spinSlow{to{transform:rotate(360deg)}}
  .brand{font-size:clamp(1.7rem,5.4vw,2.8rem);display:flex;gap:.04em;flex-wrap:wrap;justify-content:center;text-align:center;max-width:90vw}
  .brand span{opacity:0;transform:translateY(18px);animation:letterIn .55s ease forwards}
  @keyframes letterIn{to{opacity:1;transform:none}}
  .pbar{width:min(60vw,300px);height:6px;border-radius:6px;background:rgba(243,238,219,.55);overflow:hidden;position:relative}
  .pbar i{position:absolute;inset:0;width:0;border-radius:6px;background:linear-gradient(90deg,var(--cream),var(--pink),var(--cream));animation:fillBar var(--load) ease forwards}
  .pbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:shimmer 1.4s linear infinite}
  @keyframes fillBar{to{width:100%}}
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .loadtag{font-family:'Fredoka';font-weight:500;font-size:.72rem;letter-spacing:4px;text-transform:uppercase;color:var(--cream)}

  /* ============ SCREENS ============ */
  .screen{position:relative;z-index:2;min-height:100vh;display:none;flex-direction:column;align-items:center;padding:6vh 5vw 9vh}
  .screen.active{display:flex;animation:screenIn .8s ease}
  @keyframes screenIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}

  .title{font-size:clamp(2.4rem,8.5vw,5.6rem);line-height:1.06;text-align:center;animation:floaty 5s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .subtitle{margin-top:18px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(1.3rem,3.4vw,2rem);color:var(--cream);text-shadow:0 2px 0 var(--pink-deep),0 4px 8px rgba(70,60,30,.25);animation:floaty 5s ease-in-out infinite .4s}
  .pick-hint{margin-top:12px;font-family:'Fredoka';font-weight:500;font-size:.72rem;letter-spacing:4px;text-transform:uppercase;color:var(--cream);opacity:.85}

  .grid{margin-top:48px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px;width:min(880px,92vw)}
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:18px}}
  @media(max-width:460px){.grid{grid-template-columns:1fr}}
  .card{perspective:1200px;aspect-ratio:3/4;cursor:pointer;opacity:0;transform:translateY(40px);animation:cardIn .7s ease forwards}
  .card:nth-child(1){animation-delay:.1s}.card:nth-child(2){animation-delay:.2s}.card:nth-child(3){animation-delay:.3s}
  .card:nth-child(4){animation-delay:.4s}.card:nth-child(5){animation-delay:.5s}
  @keyframes cardIn{to{opacity:1;transform:none}}
  .inner{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.25,1);transform-style:preserve-3d;border-radius:26px}
  .card:hover .inner,.card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;overflow:hidden;box-shadow:0 16px 34px rgba(110,132,76,.3);border:4px solid var(--cream)}
  .front{display:flex;align-items:flex-end;justify-content:center;color:#fff}
  .front .photo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4.4rem}
  .front .name-band{position:relative;z-index:2;width:100%;padding:16px;text-align:center;font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.5rem;color:var(--cream);text-shadow:0 2px 0 var(--sage-dark),0 3px 6px rgba(0,0,0,.35)}
  .back{transform:rotateY(180deg);background:linear-gradient(145deg,var(--cream),var(--pink));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center}
  .back h3{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.6rem;color:var(--sage-dark)}
  .back .quote{font-size:.98rem;line-height:1.5;font-weight:500}
  .btn{border:none;border-radius:40px;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;color:var(--cream);background:linear-gradient(135deg,var(--sage-deep),var(--sage-dark));box-shadow:0 8px 18px rgba(110,132,76,.4);transition:transform .2s ease}
  .btn:hover{transform:translateY(-3px) scale(1.04)}
  .btn.pink{background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#5e3a4c;box-shadow:0 8px 18px rgba(209,140,173,.5)}
  .btn.ghost{background:var(--glass);color:var(--text);box-shadow:0 6px 16px rgba(0,0,0,.08);backdrop-filter:blur(8px)}
  .back .choose{margin-top:4px;padding:10px 22px;font-size:.9rem}
  .card.chosen .face{border-color:var(--pink-deep);box-shadow:0 0 0 4px var(--pink),0 18px 36px rgba(209,140,173,.5)}
  .cta-row{margin-top:42px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;opacity:0;transform:translateY(14px);transition:.5s}
  .cta-row.show{opacity:1;transform:none}
  .cta-row .btn{padding:16px 34px;font-size:1.05rem}
  .chosen-note{margin-top:16px;font-family:'Fredoka';font-weight:600;color:var(--cream);text-shadow:0 2px 0 var(--pink-deep);opacity:0;transition:.5s}
  .chosen-note.show{opacity:1}

  /* ============ QUIZ ============ */
  .quiz-wrap{width:min(820px,94vw);background:var(--glass);backdrop-filter:blur(16px);border:3px solid var(--cream);border-radius:30px;box-shadow:0 24px 60px rgba(110,132,76,.25);padding:34px 30px;margin-top:10px}
  .q-top{display:flex;justify-content:space-between;align-items:center;font-family:'Fredoka';font-weight:600;font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--sage-dark)}
  .q-round-name{color:var(--pink-dark)}
  .progress{height:9px;border-radius:8px;background:rgba(255,255,255,.5);margin:16px 0 26px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--sage-deep),var(--pink-deep));transition:width .5s ease}
  .q-text{font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(1.4rem,4vw,2.1rem);line-height:1.3;text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--text)}
  .q-img{max-width:100%;max-height:240px;border-radius:18px;margin:8px auto 0;display:block;box-shadow:0 10px 24px rgba(0,0,0,.15)}
  .timer{margin:22px auto 6px;width:120px;height:120px;position:relative}
  .timer svg{transform:rotate(-90deg)}
  .timer .bg{stroke:rgba(255,255,255,.5)}
  .timer .fg{stroke:var(--sage-dark);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .4s}
  .timer .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:700;font-size:2rem;color:var(--sage-dark)}
  .answer{margin-top:18px;text-align:center;font-family:'Fredoka';font-weight:600;font-size:1.3rem;color:var(--pink-dark);background:rgba(255,255,255,.55);border-radius:18px;padding:16px;display:none}
  .answer.show{display:block;animation:screenIn .5s ease}
  .answer span{display:block;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin-bottom:6px;color:var(--text)}
  .q-controls{margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .q-controls .btn{padding:13px 26px;font-size:.95rem}
  .round-intro{text-align:center;padding:30px 10px}
  .round-intro .big{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(2rem,6vw,3.2rem);color:var(--sage-dark)}
  .round-intro .desc{margin-top:14px;font-size:1.02rem;max-width:520px;margin-inline:auto;line-height:1.55}
  .round-intro .meta{margin-top:18px;font-family:'Fredoka';font-weight:600;color:var(--pink-dark)}

  .scorebar{width:min(820px,94vw);margin-top:18px;background:var(--glass);backdrop-filter:blur(12px);border:3px solid var(--cream);border-radius:24px;padding:18px}
  .scorebar h4{font-family:'Fredoka',sans-serif;font-weight:700;text-align:center;color:var(--sage-dark);margin-bottom:14px}
  .players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:640px){.players{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:380px){.players{grid-template-columns:1fr}}
  .player{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.6);border-radius:18px;padding:8px 10px;border:2px solid transparent}
  .player.me{border-color:var(--pink-deep);box-shadow:0 0 0 3px var(--pink)}
  .player .em{font-size:1.3rem}
  .player .pn{flex:1;font-family:'Fredoka';font-weight:600;font-size:.92rem;color:var(--text)}
  .player .sc{font-family:'Fredoka',sans-serif;font-weight:700;min-width:24px;text-align:center;color:var(--pink-dark);font-size:1.1rem}
  .player button{width:26px;height:26px;border:none;border-radius:50%;cursor:pointer;font-weight:700;color:#fff;font-size:1rem;line-height:1}
  .player .plus{background:var(--sage-deep)}.player .minus{background:var(--pink-deep)}

  .rank{list-style:none;width:100%;max-width:520px;margin:22px auto 0;display:flex;flex-direction:column;gap:12px}
  .rank li{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.65);border-radius:18px;padding:14px 18px;border:2px solid transparent;animation:rankIn .6s ease both}
  .rank li:nth-child(1){animation-delay:.1s}.rank li:nth-child(2){animation-delay:.2s}.rank li:nth-child(3){animation-delay:.3s}
  .rank li:nth-child(4){animation-delay:.4s}.rank li:nth-child(5){animation-delay:.5s}
  @keyframes rankIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
  .rank .pos{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.5rem;width:42px;text-align:center}
  .rank .em{font-size:1.6rem}
  .rank .nm{flex:1;font-family:'Fredoka';font-weight:600;font-size:1.05rem;color:var(--text)}
  .rank .pts{font-family:'Fredoka',sans-serif;font-weight:700;color:var(--pink-dark);font-size:1.2rem}
  .rank li.top{background:linear-gradient(135deg,var(--cream),var(--pink));border-color:var(--pink-deep)}
  .rank li.me{outline:2px dashed var(--sage-dark);outline-offset:2px}

  .top-back{position:fixed;top:18px;left:18px;z-index:60;padding:10px 18px;font-size:.85rem;border-radius:40px}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader" style="--load:4400ms">
  <div class="emblem">
    <div class="halo"></div>
    <div class="glow"></div>
    <div class="lflower">
      <svg viewBox="0 0 100 100" id="loaderFlower"></svg>
    </div>
  </div>
  <div class="brand bubble" id="brand"></div>
  <div class="pbar"><i></i></div>
  <div class="loadtag">собираем атмосферу…</div>
</div>

<div class="garden" id="garden"></div>

<!-- HERO -->
<section class="screen" id="hero">
  <h1 class="title bubble">Квиз&nbsp;плиз.<br>Ливадия&nbsp;edition</h1>
  <div class="subtitle">Выбери своего бойца</div>
  <div class="pick-hint">наведи курсор · нажми · выбери</div>
  <div class="grid" id="grid"></div>
  <div class="chosen-note" id="chosenNote"></div>
  <div class="cta-row" id="ctaRow">
    <button class="btn pink" id="startQuizBtn">Поехали в квиз →</button>
  </div>
</section>

<!-- QUIZ -->
<section class="screen" id="quiz">
  <button class="btn ghost top-back" id="backHome">← На главную</button>
  <div id="quizStage"></div>
  <div class="scorebar" id="scorebar" style="display:none">
    <h4>Индивидуальный зачёт</h4>
    <div class="players" id="players"></div>
  </div>
</section>

<script>
/* ===== QUIZ DATA — заполняйте вопросы здесь ===== */
const QUIZ = [
  {title:"Раунд 1 · Разминка",desc:"Лёгкие вопросы, чтобы войти в ритм. Отвечаем без напряга.",timer:30,
   questions:[
     {q:"ПРИМЕР: В каком море находится Ливадия?",a:"Чёрное море"},
     {q:"ПРИМЕР: Сколько игроков в парном падел-матче?",a:"Четверо (2 на 2)"},
     {q:"⟶ ваш вопрос…",a:"⟶ ваш ответ…"},{q:"⟶ ваш вопрос…",a:"⟶ ваш ответ…"},
     {q:"⟶ ваш вопрос…",a:"⟶ ваш ответ…"},{q:"⟶ ваш вопрос…",a:"⟶ ваш ответ…"},
     {q:"⟶ ваш вопрос…",a:"⟶ ваш ответ…"},
   ]},
  {title:"Раунд 2 · Это про нас",desc:"Вопросы про нашу компанию: кто что любит, смешные истории.",timer:30,
   questions:[
     {q:"ПРИМЕР: Кто из девчонок всегда опаздывает на корт?",a:"⟶ впишите имя"},
     {q:"⟶ ваш вопрос про нас…",a:"⟶ ответ…"},{q:"⟶ ваш вопрос про нас…",a:"⟶ ответ…"},
     {q:"⟶ ваш вопрос про нас…",a:"⟶ ответ…"},{q:"⟶ ваш вопрос про нас…",a:"⟶ ответ…"},
     {q:"⟶ ваш вопрос про нас…",a:"⟶ ответ…"},{q:"⟶ ваш вопрос про нас…",a:"⟶ ответ…"},
   ]},
  {title:"Раунд 3 · Музыкальный",desc:"Включаем отрывок песни — угадываем исполнителя или название.",timer:25,
   questions:[
     {q:"ПРИМЕР: Чей это хит? (включите отрывок)",a:"⟶ исполнитель / трек"},
     {q:"⟶ песня…",a:"⟶ ответ…"},{q:"⟶ песня…",a:"⟶ ответ…"},{q:"⟶ песня…",a:"⟶ ответ…"},
     {q:"⟶ песня…",a:"⟶ ответ…"},{q:"⟶ песня…",a:"⟶ ответ…"},{q:"⟶ песня…",a:"⟶ ответ…"},
   ]},
  {title:"Раунд 4 · Угадай по фото",desc:"Картинка на экране — угадываем, что/кто это. Добавьте ссылку img.",timer:25,
   questions:[
     {q:"ПРИМЕР: Что за место на фото?",a:"⟶ ответ…",img:""},
     {q:"⟶ что на фото…",a:"⟶ ответ…",img:""},{q:"⟶ что на фото…",a:"⟶ ответ…",img:""},
     {q:"⟶ что на фото…",a:"⟶ ответ…",img:""},{q:"⟶ что на фото…",a:"⟶ ответ…",img:""},
     {q:"⟶ что на фото…",a:"⟶ ответ…",img:""},{q:"⟶ что на фото…",a:"⟶ ответ…",img:""},
   ]},
  {title:"Раунд 5 · Блиц",desc:"Быстрые вопросы, короткий таймер. Кто быстрее — тот и молодец!",timer:15,
   questions:[
     {q:"ПРИМЕР: Столица Италии?",a:"Рим"},
     {q:"⟶ блиц…",a:"⟶ ответ…"},{q:"⟶ блиц…",a:"⟶ ответ…"},{q:"⟶ блиц…",a:"⟶ ответ…"},
     {q:"⟶ блиц…",a:"⟶ ответ…"},{q:"⟶ блиц…",a:"⟶ ответ…"},{q:"⟶ блиц…",a:"⟶ ответ…"},
     {q:"⟶ блиц…",a:"⟶ ответ…"},{q:"⟶ блиц…",a:"⟶ ответ…"},{q:"⟶ блиц…",a:"⟶ ответ…"},
   ]},
  {title:"Раунд 6 · Кто из нас",desc:"Угадываем, о ком из девчонок идёт речь. Самый «наш» раунд.",timer:30,
   questions:[
     {q:"ПРИМЕР: Кто из нас может проговорить весь матч и не устать?",a:"⟶ имя"},
     {q:"⟶ кто из нас…",a:"⟶ имя"},{q:"⟶ кто из нас…",a:"⟶ имя"},{q:"⟶ кто из нас…",a:"⟶ имя"},
     {q:"⟶ кто из нас…",a:"⟶ имя"},{q:"⟶ кто из нас…",a:"⟶ имя"},{q:"⟶ кто из нас…",a:"⟶ имя"},
   ]},
  {title:"Раунд 7 · Финал со ставками",desc:"Перед вопросом ставишь баллы (1–5). Угадал — получаешь ставку, нет — теряешь.",timer:45,
   questions:[
     {q:"ПРИМЕР: Сколько весит теннисный мяч (в граммах)?",a:"≈ 57–58 г"},
     {q:"⟶ финальный вопрос…",a:"⟶ ответ…"},{q:"⟶ финальный вопрос…",a:"⟶ ответ…"},
     {q:"⟶ финальный вопрос…",a:"⟶ ответ…"},{q:"⟶ супер-финал…",a:"⟶ ответ…"},
   ]},
];

/* ===== fighters (без Настюшки) ===== */
const fighters = [
  {name:"Гелик",   emoji:"🌼", bg:"linear-gradient(160deg,#8ca268,#f3eedb)", quote:"«Бью по мячу — попадаю в сердце»"},
  {name:"Викусик", emoji:"🌸", bg:"linear-gradient(160deg,#e3a9c4,#f3eedb)", quote:"«Грация снаружи, ракета внутри»"},
  {name:"Соник",   emoji:"⚡", bg:"linear-gradient(160deg,#f3eedb,#a3b67e)", quote:"«Быстрее мяча, громче победы»"},
  {name:"Евик",    emoji:"🌷", bg:"linear-gradient(160deg,#e3a9c4,#8ca268)", quote:"«Лёгкая подача, тяжёлый нокаут»"},
  {name:"Алина",   emoji:"🤍", bg:"linear-gradient(160deg,#f3eedb,#e3a9c4)", quote:"«Спокойствие — моё секретное оружие»"},
];
const scores={};fighters.forEach(f=>scores[f.name]=0);
let myFighter=null;

/* ===== retro flower svg ===== */
function flowerSVG(petal,center){
  let p='';for(let a=0;a<360;a+=60){p+=`<ellipse cx="50" cy="25" rx="15" ry="23" fill="${petal}" transform="rotate(${a} 50 50)"/>`}
  return p+`<circle cx="50" cy="50" r="14" fill="${center}"/>`;
}
document.getElementById('loaderFlower').innerHTML=flowerSVG('#f3eedb','#8ca268');

/* ===== cards ===== */
const grid=document.getElementById('grid');
fighters.forEach(f=>{
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`
    <div class="inner">
      <div class="face front" style="background:${f.bg}"><div class="photo">${f.emoji}</div><div class="name-band">${f.name}</div></div>
      <div class="face back"><h3>${f.name}</h3><div class="quote">${f.quote}</div><button class="btn choose">Играю за неё</button></div>
    </div>`;
  card.addEventListener('click',e=>{if(e.target.classList.contains('choose'))return;card.classList.toggle('flipped')});
  card.querySelector('.choose').addEventListener('click',e=>{
    e.stopPropagation();
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('chosen'));
    card.classList.add('chosen');myFighter=f.name;
    const note=document.getElementById('chosenNote');
    note.textContent=`Сегодня ты играешь за ${f.name} ${f.emoji}`;note.classList.add('show');
    document.getElementById('ctaRow').classList.add('show');
  });
  grid.appendChild(card);
});

/* ===== floating flowers garden ===== */
const garden=document.getElementById('garden');
const palette=[['#f3eedb','#8ca268'],['#e3a9c4','#f3eedb'],['#f3eedb','#d18cad'],['#d6e0b4','#8ca268']];
for(let i=0;i<12;i++){
  const fl=document.createElement('div');fl.className='fl';
  const sz=50+Math.random()*90;
  fl.style.width=fl.style.height=sz+'px';fl.style.left=Math.random()*100+'vw';
  fl.style.animationDuration=(16+Math.random()*16)+'s';fl.style.animationDelay=(-Math.random()*26)+'s';
  const c=palette[Math.floor(Math.random()*palette.length)];
  fl.innerHTML=`<svg viewBox="0 0 100 100">${flowerSVG(c[0],c[1])}</svg>`;
  garden.appendChild(fl);
}

/* ===== loader brand letters ===== */
const brandEl=document.getElementById('brand');
"Квиз плиз. Ливадия edition".split('').forEach((ch,i)=>{
  const sp=document.createElement('span');sp.textContent=ch===' '?' ':ch;
  sp.style.animationDelay=(.5+i*.05)+'s';brandEl.appendChild(sp);
});

/* ===== screens ===== */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}

/* ===== individual scoreboard ===== */
const playersEl=document.getElementById('players');
function buildPlayers(){
  playersEl.innerHTML='';
  fighters.forEach(f=>{
    const p=document.createElement('div');p.className='player'+(f.name===myFighter?' me':'');
    p.innerHTML=`<span class="em">${f.emoji}</span><span class="pn">${f.name}</span>
      <button class="minus">−</button><span class="sc">${scores[f.name]}</span><button class="plus">+</button>`;
    const sc=p.querySelector('.sc');
    p.querySelector('.plus').onclick=()=>{scores[f.name]++;sc.textContent=scores[f.name]};
    p.querySelector('.minus').onclick=()=>{scores[f.name]=Math.max(0,scores[f.name]-1);sc.textContent=scores[f.name]};
    playersEl.appendChild(p);
  });
}

/* ===== quiz engine ===== */
const stage=document.getElementById('quizStage');
let rIdx=0,qIdx=0,timerInt=null;const CIRC=2*Math.PI*52;

function renderRoundIntro(){
  clearInterval(timerInt);
  document.getElementById('scorebar').style.display='block';buildPlayers();
  const r=QUIZ[rIdx];
  stage.innerHTML=`<div class="quiz-wrap"><div class="round-intro">
      <div class="big">${r.title}</div><div class="desc">${r.desc}</div>
      <div class="meta">${r.questions.length} вопрос(ов) · ${r.timer} сек на каждый</div>
      <div class="q-controls"><button class="btn" id="goRound">Начать раунд →</button></div>
      <div style="margin-top:10px;font-size:.8rem;opacity:.6">Раунд ${rIdx+1} из ${QUIZ.length}</div>
    </div></div>`;
  document.getElementById('goRound').onclick=()=>{qIdx=0;renderQuestion()};
}

function renderQuestion(){
  clearInterval(timerInt);
  const r=QUIZ[rIdx],q=r.questions[qIdx];const prog=Math.round((qIdx/r.questions.length)*100);
  stage.innerHTML=`<div class="quiz-wrap">
      <div class="q-top"><span class="q-round-name">${r.title}</span><span>Вопрос ${qIdx+1} / ${r.questions.length}</span></div>
      <div class="progress"><i style="width:${prog}%"></i></div>
      <div class="q-text">${q.q}</div>
      ${q.img?`<img class="q-img" src="${q.img}" alt=""/>`:''}
      <div class="timer"><svg width="120" height="120" viewBox="0 0 120 120">
        <circle class="bg" cx="60" cy="60" r="52" fill="none" stroke-width="10"/>
        <circle class="fg" id="ring" cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-dasharray="${CIRC}" stroke-dashoffset="0"/></svg>
        <div class="num" id="tnum">${r.timer}</div></div>
      <div class="answer" id="answer"><span>Правильный ответ</span>${q.a}</div>
      <div class="q-controls">
        <button class="btn ghost" id="prevBtn">←</button>
        <button class="btn pink" id="revealBtn">Показать ответ</button>
        <button class="btn" id="nextBtn">${qIdx+1<r.questions.length?'Следующий →':(rIdx+1<QUIZ.length?'Следующий раунд →':'Итоги 🏆')}</button>
      </div></div>`;
  startTimer(r.timer);
  document.getElementById('revealBtn').onclick=()=>{document.getElementById('answer').classList.add('show');clearInterval(timerInt)};
  document.getElementById('prevBtn').onclick=()=>{if(qIdx>0){qIdx--;renderQuestion()}else if(rIdx>0){rIdx--;qIdx=QUIZ[rIdx].questions.length-1;renderQuestion()}};
  document.getElementById('nextBtn').onclick=()=>{
    if(qIdx+1<r.questions.length){qIdx++;renderQuestion()}
    else if(rIdx+1<QUIZ.length){rIdx++;renderRoundIntro()}
    else renderFinish();
  };
}

function startTimer(sec){
  const ring=document.getElementById('ring'),num=document.getElementById('tnum');let t=sec;num.textContent=t;
  timerInt=setInterval(()=>{t--;num.textContent=Math.max(0,t);ring.style.strokeDashoffset=CIRC*(1-t/sec);
    if(t<=Math.ceil(sec*0.3))ring.style.stroke='var(--pink-dark)';
    if(t<=0){clearInterval(timerInt);num.textContent='⏰'}},1000);
}

function renderFinish(){
  clearInterval(timerInt);
  const sorted=[...fighters].sort((a,b)=>scores[b.name]-scores[a.name]);
  const medals=['🥇','🥈','🥉'];
  const rows=sorted.map((f,i)=>`
    <li class="${i===0?'top':''} ${f.name===myFighter?'me':''}">
      <span class="pos">${medals[i]||(i+1)}</span><span class="em">${f.emoji}</span>
      <span class="nm">${f.name}</span><span class="pts">${scores[f.name]}</span></li>`).join('');
  const w=sorted[0];
  stage.innerHTML=`<div class="quiz-wrap"><div class="round-intro">
      <div class="big">Итоговый рейтинг 🏆</div>
      <div class="desc">Победитель вечера — <b>${w.name} ${w.emoji}</b> с ${scores[w.name]} очк.! 🥂</div>
      <ul class="rank">${rows}</ul>
      <div class="q-controls" style="margin-top:24px">
        <button class="btn" id="restart">Сыграть заново</button>
        <button class="btn ghost" id="home2">На главную</button>
      </div></div></div>`;
  document.getElementById('restart').onclick=()=>{fighters.forEach(f=>scores[f.name]=0);rIdx=0;qIdx=0;renderRoundIntro()};
  document.getElementById('home2').onclick=()=>show('hero');
}

/* ===== nav ===== */
document.getElementById('startQuizBtn').onclick=()=>{show('quiz');rIdx=0;qIdx=0;renderRoundIntro()};
document.getElementById('backHome').onclick=()=>{clearInterval(timerInt);show('hero')};

/* ===== loader → hero ===== */
window.addEventListener('load',()=>{setTimeout(()=>{document.getElementById('loader').classList.add('hide');show('hero')},4400)});
</script>
</body>
