<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Квиз плиз · Ливадия edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Varela+Round&display=swap" rel="stylesheet">
<style>
  :root{
    /* dark strawberry matcha */
    --bg:#0e0d11;
    --bg-2:#15131a;
    --card:#1a1820;
    --line:#2c2935;
    --text:#f4eef1;
    --muted:#9b909a;
    --strawberry:#f08aa1;
    --strawberry-deep:#ee6a86;
    --strawberry-soft:rgba(240,138,161,.14);
    --matcha:#a9d07f;
    --matcha-deep:#bcdc97;
    --matcha-soft:rgba(169,208,127,.14);
    --radius:24px;
    --shadow:0 22px 44px -26px rgba(0,0,0,.8);
    --display:"Varela Round",ui-rounded,"Segoe UI",system-ui,sans-serif;
    --body:"Nunito Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:
      radial-gradient(120% 70% at 12% -5%, rgba(238,106,134,.16) 0%, transparent 55%),
      radial-gradient(120% 80% at 100% 105%, rgba(169,208,127,.12) 0%, transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;
  }

  /* ============ LOADER (lightweight, transform-only) ============ */
  #loader{
    position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;background:var(--bg);
    transition:opacity .55s ease;will-change:opacity;
  }
  #loader.hide{opacity:0;pointer-events:none}
  .loader-dots{display:flex;gap:14px}
  .loader-dots span{
    width:15px;height:15px;border-radius:50%;will-change:transform;
    animation:dotjump 1s ease-in-out infinite;
  }
  .loader-dots span:nth-child(1){background:var(--strawberry);animation-delay:0s}
  .loader-dots span:nth-child(2){background:#f3e9d8;animation-delay:.15s}
  .loader-dots span:nth-child(3){background:var(--matcha);animation-delay:.3s}
  .loader-title{font-family:var(--display);text-align:center}
  .loader-title h1{font-size:clamp(34px,9vw,52px);color:var(--strawberry);letter-spacing:.5px}
  .loader-title .ed{
    display:inline-block;margin-top:12px;font-family:var(--body);font-weight:700;
    font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--matcha-deep);
    background:var(--matcha-soft);padding:7px 16px;border-radius:999px;
  }
  .loadbar{width:180px;height:6px;border-radius:99px;background:var(--bg-2);overflow:hidden}
  .loadbar i{display:block;height:100%;width:100%;border-radius:99px;transform:scaleX(0);transform-origin:left;
    will-change:transform;background:linear-gradient(90deg,var(--strawberry),var(--matcha));
    animation:loadx 1.9s cubic-bezier(.4,0,.2,1) forwards}

  /* ============ APP ============ */
  #app{opacity:0;transition:opacity .6s ease;width:100%;flex:1;display:flex;flex-direction:column}
  #app.show{opacity:1}
  .wrap{width:100%;max-width:680px;margin:0 auto;padding:clamp(20px,5vw,40px);flex:1;display:flex;flex-direction:column}

  /* HOME */
  .home-head{padding:30px 0 26px;text-align:center;animation:rise .6s ease both}
  .brand-emoji{font-size:40px;display:block;margin-bottom:10px;animation:bob 4s ease-in-out infinite}
  h1{font-family:var(--display);font-size:clamp(42px,12vw,66px);line-height:1;color:var(--strawberry-deep);letter-spacing:.5px}
  .edition{
    display:inline-block;margin-top:16px;font-weight:800;font-size:12.5px;letter-spacing:.3em;
    text-transform:uppercase;color:var(--matcha-deep);background:var(--matcha-soft);
    padding:8px 18px;border-radius:999px;box-shadow:0 6px 16px -10px rgba(108,143,70,.6)
  }

  .warmup{background:linear-gradient(135deg,var(--strawberry-soft),var(--matcha-soft));
    border:1.5px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;
    cursor:pointer;text-align:center;animation:rise .6s .1s ease both;transition:transform .2s ease}
  .warmup:hover{transform:translateY(-2px)}
  .warmup:active{transform:scale(.99)}
  .warmup-tag{font-weight:800;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--strawberry);margin-bottom:12px}
  .warmup-q{font-family:var(--display);font-size:clamp(17px,4.4vw,21px);line-height:1.32;color:var(--text)}
  .warmup-hint{margin-top:12px;font-size:12px;color:var(--muted);font-weight:600}
  .rounds{display:flex;flex-direction:column;gap:14px;margin-top:10px;padding-bottom:30px}
  .round-card{
    display:flex;align-items:center;gap:18px;background:var(--card);
    border:1.5px solid var(--line);border-radius:var(--radius);padding:18px 20px;cursor:pointer;
    box-shadow:var(--shadow);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
    animation:rise .55s ease both;
  }
  .round-card:nth-child(1){animation-delay:.05s}.round-card:nth-child(2){animation-delay:.10s}
  .round-card:nth-child(3){animation-delay:.15s}.round-card:nth-child(4){animation-delay:.20s}
  .round-card:nth-child(5){animation-delay:.25s}.round-card:nth-child(6){animation-delay:.30s}
  .round-card:hover{transform:translateY(-4px);box-shadow:0 26px 50px -24px rgba(214,72,109,.5);border-color:var(--strawberry-soft)}
  .round-card:active{transform:translateY(-1px) scale(.99)}
  .rc-num{flex:0 0 52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:24px;
    background:linear-gradient(135deg,var(--strawberry-soft),var(--matcha-soft));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
  .rc-body{flex:1;min-width:0}
  .rc-title{font-family:var(--display);font-size:18px;color:var(--text)}
  .rc-meta{color:var(--muted);font-size:13px;margin-top:3px;font-weight:600}
  .rc-arrow{color:var(--strawberry);font-size:24px;font-weight:700;transition:transform .25s}
  .round-card:hover .rc-arrow{transform:translateX(5px)}

  /* GAME */
  .screen{display:none;flex:1;flex-direction:column}
  .screen.active{display:flex}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 24px}
  .back{background:none;border:none;color:var(--muted);cursor:pointer;font-family:var(--body);font-weight:700;
    font-size:15px;display:flex;align-items:center;gap:6px;padding:10px 14px 10px 0;transition:color .2s}
  .back:hover{color:var(--strawberry-deep)}
  .round-label{font-family:var(--display);font-size:14px;color:var(--matcha-deep);text-align:right;
    background:var(--matcha-soft);padding:7px 14px;border-radius:999px}

  .card-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px 0}
  .qcard{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:30px;
    padding:clamp(28px,7vw,46px);text-align:center;box-shadow:var(--shadow)}
  .q-kicker{font-weight:800;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--strawberry);margin-bottom:20px}
  .q-text{font-family:var(--display);font-size:clamp(23px,5.8vw,33px);line-height:1.3;color:var(--text)}
  #qImg{display:block;max-width:100%;max-height:46vh;margin:0 auto 22px;border-radius:18px;
    border:1.5px solid var(--line);object-fit:contain;background:#000}
  #qImg[hidden]{display:none}
  .q-text.locked{color:var(--muted);font-size:clamp(18px,4.6vw,22px)}
  .answer{margin-top:24px;padding-top:24px;border-top:1.5px dashed var(--line);display:none}
  .answer.show{display:block;animation:rise .4s ease both}
  .answer .a-main{font-family:var(--display);font-size:clamp(19px,5vw,25px);color:var(--matcha-deep)}
  .answer small{display:block;color:var(--muted);font-weight:600;font-size:14.5px;margin-top:10px;line-height:1.5}

  .controls{display:flex;flex-direction:column;gap:12px;padding-top:26px}
  .btn{width:100%;border:none;border-radius:18px;padding:18px;font-family:var(--display);font-size:17px;
    cursor:pointer;transition:transform .15s ease,box-shadow .2s,opacity .2s,background .2s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:linear-gradient(135deg,var(--strawberry),var(--strawberry-deep));color:#fff;
    box-shadow:0 14px 26px -12px rgba(214,72,109,.7)}
  .btn-primary:hover{box-shadow:0 18px 30px -12px rgba(214,72,109,.8)}
  .btn-ghost{background:var(--matcha-soft);color:var(--matcha-deep)}
  .btn-ghost:hover{background:#dde9c6}
  .btn[hidden]{display:none}

  .progress{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;padding-top:22px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:all .3s}
  .dot.done{background:var(--matcha)}
  .dot.current{background:var(--strawberry);width:24px;border-radius:8px}
  .counter{text-align:center;color:var(--muted);font-size:13px;font-weight:700;margin-top:14px}

  /* END */
  .done-screen{text-align:center;padding:30px 0;animation:rise .5s ease both}
  .done-emoji{font-size:60px;margin-bottom:16px;animation:bob 3s ease-in-out infinite}
  .done-screen h2{font-family:var(--display);font-size:30px;color:var(--strawberry-deep);margin-bottom:10px}
  .done-screen p{color:var(--muted);margin-bottom:28px;font-size:16px;font-weight:600}

  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes dotjump{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  @keyframes loadx{to{transform:scaleX(1)}}
  .swap{animation:rise .35s ease both}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:opacity .2s ease !important}
    .loadbar i{transform:scaleX(1)}
  }
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-dots" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="loader-title">
    <h1>Квиз плиз</h1><br>
    <span class="ed">Ливадия edition</span>
  </div>
  <div class="loadbar"><i></i></div>
</div>

<!-- APP -->
<div id="app">
  <div class="wrap">

    <!-- HOME -->
    <section id="home" class="screen">
      <div class="home-head">
        <span class="brand-emoji" aria-hidden="true">🍓🍵</span>
        <h1>Квиз плиз</h1>
        <div class="edition">Ливадия edition</div>
      </div>
      <div class="warmup" id="warmup" onclick="nextHostQ()" title="Нажми для следующего">
        <div class="warmup-tag">🎤 Вопрос на разогрев</div>
        <div class="warmup-q" id="warmupQ"></div>
        <div class="warmup-hint">нажми — следующий</div>
      </div>
      <div class="rounds" id="roundList"></div>
    </section>

    <!-- GAME -->
    <section id="game" class="screen">
      <div class="topbar">
        <button class="back" onclick="goHome()">‹ К раундам</button>
        <div class="round-label" id="roundLabel"></div>
      </div>
      <div class="card-stage">
        <div class="qcard" id="qcard">
          <div class="q-kicker" id="qKicker"></div>
          <img id="qImg" alt="" hidden>
          <div class="q-text" id="qText"></div>
          <div class="answer" id="qAnswer"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn btn-ghost" id="revealBtn" onclick="reveal()">Показать ответ</button>
        <button class="btn btn-primary" id="nextBtn" onclick="next()">Дальше →</button>
      </div>
      <div class="progress" id="progress"></div>
      <div class="counter" id="counter"></div>
    </section>

    <!-- END -->
    <section id="end" class="screen">
      <div class="topbar"><button class="back" onclick="goHome()">‹ К раундам</button></div>
      <div class="card-stage">
        <div class="done-screen">
          <div class="done-emoji" aria-hidden="true">🥂</div>
          <h2 id="endTitle">Раунд пройден!</h2>
          <p>Кто угадал больше всех — наливает остальным 😏</p>
          <button class="btn btn-primary" style="max-width:280px;margin:0 auto" onclick="goHome()">Вернуться к раундам</button>
        </div>
      </div>
    </section>

  </div>
</div>

let roundIdx=0, qIdx=0;

// Вопросы-наблюдения в стиле открытия Азамата
const HOSTQ=[
  "Почему коробка от обуви хранится дольше, чем сама обувь?",
  "Почему все курят кальян с таким видом, будто это они его придумали?",
  "Почему на фото «до и после» нет третьей, где человек снова всё набрал?",
  "Почему будильник на 5 минут утром — это целый сон, а 5 минут на работе — ничто?",
  "Почему мы говорим «алло», хотя уже видим, кто звонит?",
  "Почему чужой Wi-Fi всегда кажется быстрее своего?",
  "Почему пакет с пакетами есть в каждом доме, но никто не помнит, как он начался?",
  "Почему салат «на один укус» готовится три часа, а съедается за минуту?",
  "Почему мы ищем телефон тем самым телефоном, который держим в руке?",
  "Почему после фразы «короче» всегда начинается самая длинная история?"
];
let hostIdx=Math.floor(Math.random()*HOSTQ.length);
function nextHostQ(){hostIdx=(hostIdx+1)%HOSTQ.length;
  const el=document.getElementById('warmupQ');el.textContent=HOSTQ[hostIdx];
  el.parentElement.classList.remove('swap');void el.parentElement.offsetWidth;el.parentElement.classList.add('swap');}
document.getElementById('warmupQ').textContent=HOSTQ[hostIdx];

const list=document.getElementById('roundList');
ROUNDS.forEach((r,i)=>{
  const el=document.createElement('div');
  el.className='round-card';
  el.setAttribute('role','button');el.setAttribute('tabindex','0');
  el.onclick=()=>startRound(i);
  el.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();startRound(i);}};
  el.innerHTML=`<div class="rc-num" aria-hidden="true">${r.emoji}</div>
    <div class="rc-body"><div class="rc-title">${r.title}</div>
    <div class="rc-meta">${r.desc} · ${r.items.length} карточек</div></div>
    <div class="rc-arrow" aria-hidden="true">→</div>`;
  list.appendChild(el);
});

function showScreen(id){
  ['home','game','end'].forEach(s=>document.getElementById(s).classList.toggle('active',s===id));
  window.scrollTo({top:0,behavior:'smooth'});
}
function startRound(i){roundIdx=i;qIdx=0;showScreen('game');render();}
function render(){
  const r=ROUNDS[roundIdx], item=r.items[qIdx], hasA=!!item.a;
  document.getElementById('roundLabel').textContent=r.title;
  const card=document.getElementById('qcard');
  card.classList.remove('swap');void card.offsetWidth;card.classList.add('swap');
  document.getElementById('qKicker').textContent=r.kicker;
  const qt=document.getElementById('qText');
  qt.textContent=item.q;
  qt.classList.toggle('locked',!!item.pending);
  const img=document.getElementById('qImg');
  if(item.img){img.src=item.img;img.hidden=false;}else{img.hidden=true;img.removeAttribute('src');}
  const ans=document.getElementById('qAnswer');
  ans.classList.remove('show');
  ans.innerHTML=hasA?`<div class="a-main">${item.a}</div>${item.note?`<small>${item.note}</small>`:''}`:'';
  const rev=document.getElementById('revealBtn');
  rev.hidden=!hasA;rev.textContent='Показать ответ';rev.disabled=false;rev.style.opacity=1;
  document.getElementById('nextBtn').textContent=(qIdx===r.items.length-1)?'Завершить раунд ✦':'Дальше →';
  const prog=document.getElementById('progress');prog.innerHTML='';
  r.items.forEach((_,k)=>{const d=document.createElement('div');
    d.className='dot'+(k<qIdx?' done':'')+(k===qIdx?' current':'');prog.appendChild(d);});
  document.getElementById('counter').textContent=`Вопрос ${qIdx+1} из ${r.items.length}`;
}
function reveal(){
  document.getElementById('qAnswer').classList.add('show');
  const b=document.getElementById('revealBtn');b.disabled=true;b.style.opacity=.45;b.textContent='Ответ открыт';
}
function next(){
  const r=ROUNDS[roundIdx];
  if(qIdx<r.items.length-1){qIdx++;render();}
  else{document.getElementById('endTitle').textContent=`${r.title} — пройден!`;showScreen('end');}
}
function goHome(){showScreen('home');}

// loader → app
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
showScreen('home');
window.addEventListener('load',()=>{
  const wait=reduce?300:2050;
  setTimeout(()=>{
    document.getElementById('loader').classList.add('hide');
    document.getElementById('app').classList.add('show');
  },wait);
});
